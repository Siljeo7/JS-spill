<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="side">
            <div class="farge1">
                <div id="grønn"></div>
                <p>Riktig bokstav, riktig plassering</p>
            </div>
            <div class="farge2">
                <div id="blå"></div>
                <p>Riktig bokstav, feil plassering</p>
            </div>
            <div class="farge3">
                <div id="rosa"></div>
                <p>Feil bokstav</p>
            </div>
        </div>

        <div class="container">
            <h1>SOMMER WORDLE</h1>
            <div id="game"></div>
        </div>

        <div class="keyboard-container">
            <div id="keyboard"></div>
        </div>
    </main>

    <script>
        /* Oppretter en ordbok med mulige ord for Wordle-spillet */
        const dictionary = ['solen', 'spise', 'smile', 'isbit', 'synge', 'seile', 'sykle', 'spill', 'drue', 'dusje', 'drikk', 'havet', 'padle', 'bader', 'grønn', 'ferie', 'varme', 'bølge', 'syden', 'kjole', 'grill', 'farge', 'dykke', 'hytte', 'glass', 'reise', 'lykke', 'chill', 'båter', 'palme', 'flipp', 'flapp', 'skjær', 'fjell', 'danse', 'lilla', 'minne', 'kjøre', 'fiske', 'bilde', 'sushi', 'pizza', 'pasta', 'reker', 'ringe', 'penge', 'betal', 'jobbe', 'pynte', 'hvile', 'pause', 'sover', 'kadda', 'vanne', 'anker', 'stein', 'skjell', 'kreps', 'godis', 'kreta', 'drink', 'måned', 'paris', 'porto', 'split', 'naxos', 'koser', 'malta', 'dubai', 'qatar', 'stupe', 'kenya', 'milan', 'lagos', 'japan'];

        /* Initialiserer tilstanden til spillet */
        const state = {
            secret: dictionary[Math.floor(Math.random() * dictionary.length)], /* Velger et tilfeldig ord som skal gjettes */
            grid: Array(6).fill().map(() => Array(5).fill('')), /* Lager et rutenett for spillet, 6 rader og 5 kolonner */
            currentRow: 0, /* Nåværende rad som brukeren er på */
            currentCol: 0, /* Nåværende kolonne som brukeren skriver i */
        };

        /* Funksjon for å tegne rutenettet på skjermen */
        function drawGrid() {
            const container = document.getElementById('game');
            container.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'grid';
            for (let i = 0; i < 6; i++) { /* Tegner 6 rader */
                for (let j = 0; j < 5; j++) { /* Tegner 5 kolonner */
                    const box = document.createElement('div');
                    box.className = 'box';
                    box.id = `box${i}${j}`;
                    grid.appendChild(box);
                }
            }
            container.appendChild(grid);
            updateGrid(); /* Oppdaterer rutenettet med innhold */
        }

        /* Funksjon for å oppdatere rutenettet etter hvert gjetning */
        function updateGrid() {
            for (let i = 0; i < state.grid.length; i++) {
                for (let j = 0; j < state.grid[i].length; j++) {
                    const box = document.getElementById(`box${i}${j}`);
                    box.textContent = state.grid[i][j]; /* Setter inn innholdet i hver boks */
                }
            }
        }

        /* Funksjon for å oppdatere tastaturet med riktig farge etter et gjettet ord */
        function updateKeyboard(guess) {
            for (let i = 0; i < guess.length; i++) {
                const letter = guess[i];
                const keyElement = document.getElementById(`key-${letter}`);
                if (!keyElement) continue;

                if (state.secret[i] === letter) {
                    keyElement.classList.remove('nesten', 'tom');
                    keyElement.classList.add('riktig'); /* Riktig bokstav på riktig plass */
                } else if (state.secret.includes(letter)) {
                    if (!keyElement.classList.contains('riktig')) {
                        keyElement.classList.remove('tom');
                        keyElement.classList.add('nesten'); /* Riktig bokstav på feil plass */
                    }
                } else {
                    keyElement.classList.add('tom'); /* Feil bokstav */
                }
            }
        }

        /* Funksjon for å avsløre og vurdere ordet som er gjettet */
        function revealWord(guess) {
            const row = state.currentRow;

            if (guess === state.secret) { /* Hvis ordet er riktig */
                for (let i = 0; i < 5; i++) {
                    const box = document.getElementById(`box${row}${i}`);
                    box.classList.add('riktig');
                }

                setTimeout(() => {
                    alert('Gratulerer! Du gjettet det riktige ordet!');
                }, 200);
                return;
            }

            for (let i = 0; i < 5; i++) {
                const box = document.getElementById(`box${row}${i}`);
                const letter = guess[i];

                if (state.secret[i] === letter) {
                    box.classList.add('riktig');
                } else if (state.secret.includes(letter)) {
                    box.classList.add('nesten');
                } else {
                    box.classList.add('tom');
                }
            }

            updateKeyboard(guess);

            if (state.currentRow === 5) {
                setTimeout(() => {
                    alert(`Game over! Ordet var "${state.secret}".`);
                }, 200);
            }
        }

        /* Håndterer tastetrykk (backspace, enter, bokstaver) */
        function handleKeyPress(key) {
            if (key === 'enter' && state.currentCol === 5) {
                const guess = state.grid[state.currentRow].join('');
                if (dictionary.includes(guess)) {
                    revealWord(guess); /* Hvis ordet er gyldig, avslør ordet */
                    state.currentRow++;
                    state.currentCol = 0;
                } else {
                    alert('Ikke et gyldig ord');
                }
            } else if (key === 'backspace' && state.currentCol > 0) {
                state.currentCol--;
                state.grid[state.currentRow][state.currentCol] = '';
                updateGrid(); /* Fjerner en bokstav hvis backspace er trykket */
            } else if (key.length === 1 && key.match(/[a-å]/i) && state.currentCol < 5) {
                state.grid[state.currentRow][state.currentCol] = key;
                state.currentCol++;
                updateGrid(); /* Legger til en bokstav hvis en tast er trykket */
            }
        }

        /* Tegner tastaturet på skjermen */
        function drawKeyboard() {
            const keyboard = document.getElementById('keyboard');
            const rows = ['abcdef', 'ghijkl', 'mnopqr', 'stuvwx', 'yzæøå'];

            rows.forEach((row) => {
                row.split('').forEach(key => {
                    const keyElement = document.createElement('div');
                    keyElement.textContent = key;
                    keyElement.className = 'key';
                    keyElement.id = `key-${key}`;
                    keyElement.onclick = () => handleKeyPress(key);
                    keyboard.appendChild(keyElement);
                });
            });

            /* Legger tilbakeknappen på siste rad, på slutten */
            const backspaceKey = document.createElement('div');
            backspaceKey.textContent = '⌫';
            backspaceKey.className = 'key';
            backspaceKey.id = 'key-backspace';
            backspaceKey.onclick = () => handleKeyPress('backspace');
            keyboard.appendChild(backspaceKey);
        };

        /* Initialiserer spillet når nettsiden lastes */
        document.body.onkeydown = (e) => {
            const key = e.key.toLowerCase();

            if (key === 'enter' && state.currentCol === 5) {
                const guess = state.grid[state.currentRow].join('');
                if (dictionary.includes(guess)) {
                    revealWord(guess);
                    state.currentRow++;
                    state.currentCol = 0;
                } else {
                    alert('Ikke et gyldig ord');
                }
            } else if (key === 'backspace' && state.currentCol > 0) {
                state.currentCol--;
                state.grid[state.currentRow][state.currentCol] = '';
                updateGrid();
            } else if (key.length === 1 && key.match(/[a-å]/i) && state.currentCol < 5) {
                state.grid[state.currentRow][state.currentCol] = key;
                state.currentCol++;
                updateGrid();
            }
        };

        function startup() {
            drawGrid();
            document.body.tabIndex = -1;
            document.body.focus();
            drawKeyboard();
        }

        startup(); 
    </script>
</body>

</html>
