<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle med Poengtelling</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="side">
            <div class="farge1">
                <div id="grønn"></div>
                <p>Riktig bokstav, riktig plassering</p>
            </div>
            <div class="farge2">
                <div id="blå"></div>
                <p>Riktig bokstav, feil plassering</p>
            </div>
            <div class="farge3">
                <div id="rosa"></div>
                <p>Feil bokstav</p>
            </div>
        </div>

        <div class="container">
            <h1>SOMMER WORDLE</h1>
            <div class="score-container">
                <p>Poeng: <span id="score-display">0</span></p>
            </div>
            <div id="game"></div>
        </div>

        <div class="keyboard-container">
            <div id="keyboard"></div>
        </div>
    </main>

    <script>
        const dictionary = ['solen', 'spise', 'smile', 'synge', 'seile', 'sykle', 'spill', 'drikk', 'havet', 'padle', 'bader', 'grønn', 'ferie', 'varme', 'bølge', 'syden', 'kjole', 'grill', 'farge', 'dykke', 'hytte', 'hytta', 'glass', 'reise', 'lykke', 'båter', 'palme', 'skjær', 'fjell', 'danse', 'minne', 'kjøre', 'fiske', 'bilde', 'reker', 'betal', 'jobbe', 'hvile', 'pause', 'sover', 'kadda', 'vanne', 'anker', 'stein', 'skjell', 'kreps', 'godis', 'kreta', 'drink', 'måned', 'split', 'naxos', 'koser', 'malta', 'dubai', 'stupe', 'milan'];

        const state = {
            secret: dictionary[Math.floor(Math.random() * dictionary.length)],
            grid: Array(6).fill().map(() => Array(5).fill('')),
            currentRow: 0,
            currentCol: 0,
            score: 0,
        };

        function drawGrid() {
            const container = document.getElementById('game');
            container.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'grid';
            for (let i = 0; i < 6; i++) {
                for (let j = 0; j < 5; j++) {
                    const box = document.createElement('div');
                    box.className = 'box';
                    box.id = `box${i}${j}`;
                    grid.appendChild(box);
                }
            }
            container.appendChild(grid);
            updateGrid();
        }

        function updateGrid() {
            for (let i = 0; i < state.grid.length; i++) {
                for (let j = 0; j < state.grid[i].length; j++) {
                    const box = document.getElementById(`box${i}${j}`);
                    box.textContent = state.grid[i][j];
                }
            }
        }

        function updateKeyboard(guess) {
            for (let i = 0; i < guess.length; i++) {
                const letter = guess[i];
                const keyElement = document.getElementById(`key-${letter}`);
                if (!keyElement) continue;

                if (state.secret[i] === letter) {
                    keyElement.classList.add('riktig');
                } else if (state.secret.includes(letter)) {
                    keyElement.classList.add('nesten');
                } else {
                    keyElement.classList.add('tom');
                }
            }
        }

        function updateScore() {
            const scoreDisplay = document.getElementById('score-display');
            scoreDisplay.textContent = state.score;
        }

        function revealWord(guess) {
    const row = state.currentRow;
    const letterCounts = {}; // Holder styr på antallet av hver bokstav i det hemmelige ordet

    // Telle opp bokstavene i det hemmelige ordet
    for (let i = 0; i < state.secret.length; i++) {
        letterCounts[state.secret[i]] = (letterCounts[state.secret[i]] || 0) + 1;
    }

    // Først, markér de riktige bokstavene (grønn/blå)
    for (let i = 0; i < 5; i++) {
        const box = document.getElementById(`box${row}${i}`);
        const letter = guess[i];

        if (state.secret[i] === letter) {
            box.classList.add('riktig');
            state.score += 2;
            letterCounts[letter]--; // Reduser antallet for denne bokstaven
        }
    }

    // Deretter, markér de nesten riktige bokstavene (blå) eller feil bokstaver (rosa)
    for (let i = 0; i < 5; i++) {
        const box = document.getElementById(`box${row}${i}`);
        const letter = guess[i];

        if (state.secret[i] !== letter && state.secret.includes(letter) && letterCounts[letter] > 0) {
            box.classList.add('nesten');
            state.score += 1;
            letterCounts[letter]--; // Reduser antallet for denne bokstaven
        } else if (state.secret[i] !== letter) {
            box.classList.add('tom');
        }
    }

    updateKeyboard(guess);
    updateScore();

    // Hvis ordet er riktig, gi ekstra poeng basert på raden
    if (guess === state.secret) {
        const bonusPoints = [30, 20, 10, 5, 3, 0][row];
        state.score += 10 + bonusPoints; // 10 poeng for å løse ordet + bonuspoeng
        updateScore();

        setTimeout(() => {
            alert(`Gratulerer! Du gjettet det riktige ordet! Poeng: ${state.score}`);
        }, 200);
        return;
    }

    if (state.currentRow === 5) {
        setTimeout(() => {
            alert(`Game over! Ordet var "${state.secret}". Poeng: ${state.score}`);
        }, 200);
    }
}

        function handleKeyPress(key) {
            if (key === 'enter' && state.currentCol === 5) {
                const guess = state.grid[state.currentRow].join('');
                if (dictionary.includes(guess)) {
                    revealWord(guess);
                    state.currentRow++;
                    state.currentCol = 0;
                } else {
                    alert('Ikke et gyldig ord');
                }
            } else if (key === 'backspace' && state.currentCol > 0) {
                state.currentCol--;
                state.grid[state.currentRow][state.currentCol] = '';
                updateGrid();
            } else if (key.length === 1 && key.match(/[a-å]/i) && state.currentCol < 5) {
                state.grid[state.currentRow][state.currentCol] = key;
                state.currentCol++;
                updateGrid();
            }
        }

        function drawKeyboard() {
            const keyboard = document.getElementById('keyboard');
            const rows = ['abcdef', 'ghijkl', 'mnopqr', 'stuvwx', 'yzæøå'];

            rows.forEach((row) => {
                row.split('').forEach(key => {
                    const keyElement = document.createElement('div');
                    keyElement.textContent = key;
                    keyElement.className = 'key';
                    keyElement.id = `key-${key}`;
                    keyElement.onclick = () => handleKeyPress(key);
                    keyboard.appendChild(keyElement);
                });
            });

            const backspaceKey = document.createElement('div');
            backspaceKey.textContent = '⌫';
            backspaceKey.className = 'key';
            backspaceKey.id = 'key-backspace';
            backspaceKey.onclick = () => handleKeyPress('backspace');
            keyboard.appendChild(backspaceKey);
        }

        function startup() {
            drawGrid();
            document.body.tabIndex = -1;
            document.body.focus();
            drawKeyboard();
            updateScore();
        }

        document.body.onkeydown = (e) => handleKeyPress(e.key.toLowerCase());
        startup();
    </script>
</body>

</html>
