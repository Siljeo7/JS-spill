<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game">
        <div class="grid">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </div>
    <script>

        function drawbox(container, row, col, letter = '') {
            const box = document.createElement('div');
            box.className = 'box';
            box.id = `box${row}${col}`;
            box.textContent = letter;

            container.appendChild(box);
            return box;
        }

        function drawGrid(container) {
            const grid = document.createElement('div');
            grid.className = 'grid';

            for (let i = 0; i < 6; i++) { // 6 rader
                for (let j = 0; j < 5; j++) { // 5 kolonner
                    drawbox(grid, i, j);
                }
            }

            container.appendChild(grid);
        }

        function startup() {
            const game = document.getElementById('game');
            drawGrid(game);
        }

        startup();
    </script>
</body>
</html>
