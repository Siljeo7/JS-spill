<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <main>
        <div class="side"> 
            <div class="farge1">
                <div id="grønn"></div>
                <p>Riktig bokstav, riktig plassering</p>
            </div>
            <div class="farge2">
                <div id="blå"></div>
                <p>Riktig bokstav, feil plassering</p>
            </div>
            <div class="farge3">
                <div id="rosa"></div>
                <p>Feil bokstav</p>
            </div>
        </div>
    
        <div class="container">
            <h1>SOMMER WORDLE</h1>
            <div id="game"></div>
        </div>
    </main> 


    <script>
        const dictionary = ['solen', 'drue', 'dusje', 'drikk', 'havet', 'padle', 'bader', 'grønn', 'ferie', 'varme', 'bølge', 'syden', 'kjole', 'grill', 'farge', 'dykke', 'hytte', 'glass', 'reise', 'lykke', 'chill', 'båter', 'palme', 'flipp', 'flapp', 'skjær', 'fjell', 'danse', 'lilla', 'minne', 'kjøre', 'fiske', 'bilde', 'sushi', 'pizza', 'pasta', 'reker', 'ringe', 'penge', 'betal', 'jobbe', 'pynte', 'hvile', 'pause', 'sover', 'kadda', 'vanne', 'anker', 'stein', 'skjell', 'kreps', 'godis', 'kreta', 'drink', 'måned', 'paris', 'porto', 'split', 'naxos', 'koser', 'malta', 'dubai', 'qatar', 'kenya', 'milan', 'lagos', 'siena',  ];
        const state = {
            secret: dictionary[Math.floor(Math.random() * dictionary.length)],
            grid: Array(6).fill().map(() => Array(5).fill('')),
            currentRow: 0,
            currentCol: 0,
        };

        function updateGrid() {
            for (let i = 0; i < state.grid.length; i++) {
                for (let j = 0; j < state.grid[i].length; j++) {
                    const box = document.getElementById(`box${i}${j}`);
                    box.textContent = state.grid[i][j];
                }
            }
        }

        function drawBox(container, row, col) {
            const box = document.createElement('div');
            box.className = 'box';
            box.id = `box${row}${col}`;
            container.appendChild(box);
        }

        function drawGrid() {
            const container = document.getElementById('game');
            const grid = document.createElement('div');
            grid.className = 'grid';

            for (let i = 0; i < 6; i++) {
                for (let j = 0; j < 5; j++) {
                    drawBox(grid, i, j);
                }
            }

            container.appendChild(grid);
        }

        function registerKeyboardEvents() {
            document.body.onkeydown = (e) => {
                const key = e.key;
                if (key === 'Enter') {
                    if (state.currentCol === 5) {
                        const guess = state.grid[state.currentRow].join('');
                        if (dictionary.includes(guess)) {
                            revealWord(guess);
                            state.currentRow++;
                            state.currentCol = 0;
                        } else {
                            alert('Not a valid word');
                        }
                    }
                } else if (key === 'Backspace') {
                    removeLetter();
                } else if (isLetter(key)) {
                    addLetter(key);
                }
                updateGrid();
            };
        }

        function isLetter(key) {
            return key.length === 1 && key.match(/[a-z]/i);
        }

        function addLetter(letter) {
            if (state.currentCol < 5) {
                state.grid[state.currentRow][state.currentCol] = letter;
                state.currentCol++;
            }
        }

        function removeLetter() {
            if (state.currentCol > 0) {
                state.currentCol--;
                state.grid[state.currentRow][state.currentCol] = '';
            }
        }

        function revealWord(guess) {
        const row = state.currentRow;

        if (guess === state.secret) {
            // Marker alle boksene som riktige
            for (let i = 0; i < 5; i++) {
                const box = document.getElementById(`box${row}${i}`);
                box.classList.add('riktig');
            }

            // Vent litt for å la fargene oppdatere før meldingen vises
            setTimeout(() => {
                alert('Gratulerer! Du gjettet det riktige ordet!');
            }, 200); // 200ms forsinkelse

            return; // Avslutt funksjonen fordi spillet er vunnet
        }

        // Hvis ordet ikke er riktig, sjekk hver bokstav
        for (let i = 0; i < 5; i++) {
            const box = document.getElementById(`box${row}${i}`);
            const letter = guess[i];

            if (state.secret[i] === letter) {
                box.classList.add('riktig');
            } else if (state.secret.includes(letter)) {
                box.classList.add('nesten');
            } else {
                box.classList.add('tom');
            }
        }

        // Sjekk om det er game over
        if (state.currentRow === 5) {
            setTimeout(() => {
                alert(`Game over! Ordet var "${state.secret}".`);
            }, 200);
        }
    }



        function startup() {
            drawGrid();
            registerKeyboardEvents();
            console.log(`Secret word: ${state.secret}`);
        }

        startup();
    </script>
</body>
</html>
